services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=negotiai
      - POSTGRES_PASSWORD=negotiai_dev
      - POSTGRES_DB=negotiai
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with existing PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - DATABASE_URL=postgresql://negotiai:negotiai_dev@postgres:5432/negotiai
    volumes:
      - ./backend:/app
      - ./audio_files:/app/audio_files
      - ./exports:/app/exports
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm start
    stdin_open: true
    tty: true

volumes:
  postgres_data:
